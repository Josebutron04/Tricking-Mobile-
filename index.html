<style>

<script>
(function(){
function showError(err){

  box.innerHTML='<h2 style="color:#ffcf4a">TRICK PARK no ha podido arrancar</h2><p>'+String(err&&err.message||err||'Error desconocido').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><p>Comprueba la conexión a internet y abre el archivo en Safari, no solo en la vista previa de ChatGPT.</p><button onclick="location.reload()" style="padding:12px 18px;font-size:16px">REINTENTAR</button>';
}
function loadThree(urls,index){

  const sc=document.createElement('script');sc.src=urls[index];sc.onload=()=>{try{startGame()}catch(e){showError(e)}};sc.onerror=()=>loadThree(urls,index+1);document.head.appendChild(sc);
}
function startGame(){try{(function(){
const $=id=>document.getElementById(id),TAU=Math.PI*2,G=-22,HALF=.9,R=.35;
const BOOK=[['BACKFLIP','rueda'],['BACKFLIP 360','rueda + giro de 360°'],['FRONT FLIP','rueda'],['SIDE FLIP','rueda'],['FULL TWIST','rueda + giro de 360°'],['SCOOT','rueda, en el suelo'],['ROUNDOFF','rueda, en el suelo'],['TDR','rueda, en el suelo'],['VALDEZ','rueda, en el suelo'],['HOOK KICK','rueda'],['ROUND KICK','rueda, en el suelo'],['TORNADO KICK','rueda o toca GIRO en el aire']];
const done=new Set();let mode='home',saved=false,set={sens:1,inv:0};
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x4aa8f0);scene.fog=new THREE.Fog(0x9fd0f5,50,150);
const camera=new THREE.PerspectiveCamera(55,1,.1,300);
scene.add(new THREE.HemisphereLight(0xffffff,0x6a8a4a,.95));
const sun=new THREE.DirectionalLight(0xfff2dd,.9);sun.position.set(-15,40,-10);scene.add(sun);
function tex(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return new THREE.CanvasTexture(c);}
const lam=c=>new THREE.MeshLambertMaterial({color:c});
// mapas
const boxes=[],mapG=new THREE.Group();scene.add(mapG);
const MAPS=[
 {n:'VOLTES',d:'El Prat · muros curvos',g:'curves',sky:0xcfd8e6,fog:0xdfe6ee,gnd:0xe0a25e,out:0x6b4a38,wall:0xbcb4ab,tr:0,bl:0xb08a7a},
 {n:'FUENGIROLA',d:'Fuengirola · barras azules',g:'pipes',sky:0x7fb8ea,fog:0xbcd6ee,gnd:0xd9c9a8,out:0xc8b790,wall:0xd5d7d6,tr:0x3f8f3a,bl:0xe9edf0},
 {n:'GETAFE',d:'Getafe · estructuras de acero',g:'frames',sky:0xb9c6e8,fog:0xcfd6ea,gnd:0x2b2e33,out:0x6e8f4e,wall:0xc9c0a8,tr:0x8a4a52,bl:0xc9a98a},
 {n:'TRES CANTOS',d:'Tres Cantos · bloques',g:'blocks',sky:0x4aa0ec,fog:0xa8cff0,gnd:0x1f4aa8,out:0x2f7a34,wall:0xc4c4bd,tr:0x2f6a2f,bl:0xb86a4a},
 {n:'LA GAVIA',d:'Vallecas · muros y cubos',g:'maze',sky:0x4a9ae6,fog:0xa8cbee,gnd:0x34383d,out:0x34383d,wall:0xd0d2d2,tr:0x3d7a3a,bl:0x4a5058}];
let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function add(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);mapG.add(m);return m;}
function blk(x,z,hw,hd,t,mat){add(new THREE.BoxGeometry(hw*2,t,hd*2),mat,x,t/2,z);boxes.push({x,z,hw,hd,top:t});}
function rail(x,y,z,len,rot,mat){const m=add(new THREE.CylinderGeometry(.05,.05,len,6),mat,x,y,z);if(rot==='x')m.rotation.z=Math.PI/2;else if(rot==='z')m.rotation.x=Math.PI/2;boxes.push(rot==='x'?{x,z,hw:len/2,hd:.08,top:y+.06,bot:y-.06}:rot==='z'?{x,z,hw:.08,hd:len/2,top:y+.06,bot:y-.06}:{x,z,hw:.08,hd:.08,top:y+len/2,bot:y-len/2});return m;}
function frame(x,z,w,d,h,m){for(const sx of[-1,1])for(const sz of[-1,1])rail(x+sx*w/2,h/2,z+sz*d/2,h,'y',m);for(const sz of[-1,1])rail(x,h,z+sz*d/2,w,'x',m);for(const sx of[-1,1])rail(x+sx*w/2,h,z,d,'z',m);rail(x,h*.55,z,w,'x',m);}
const tatamiT=tex(256,256,(x,w,h)=>{x.fillStyle='#e07a92';x.fillRect(0,0,w,h);x.strokeStyle='#fff';x.lineWidth=10;x.strokeRect(8,8,w-16,h-16);x.strokeStyle='rgba(70,20,40,.25)';x.lineWidth=8;x.beginPath();x.moveTo(0,h*.25);x.lineTo(w,h*.05);x.moveTo(0,h*.9);x.lineTo(w,h*.6);x.stroke();});
function tatami(x,z){const t=.35;/* Tatami XL: superficie ampliada para facilitar la recepción */add(new THREE.BoxGeometry(10.8,t,10.8),lam(0xd4687f),x,t/2,z);const pl=add(new THREE.PlaneGeometry(10.45,10.45),new THREE.MeshLambertMaterial({map:tatamiT}),x,t+.01,z);pl.rotation.x=-Math.PI/2;boxes.push({x,z,hw:5.4,hd:5.4,top:t,bounce:true});}
function bouncyAt(px,pz,fp){for(const b of boxes)if(b.bounce&&Math.abs(px-b.x)<b.hw+R&&Math.abs(pz-b.z)<b.hd+R&&fp>=b.top-.3)return true;return false;}
const hx=c=>'#'+c.toString(16).padStart(6,'0');
function conTex(M){return tex(128,128,(x,w,h)=>{x.fillStyle=hx(M.wall);x.fillRect(0,0,w,h);
  for(let k=0;k<900;k++){x.fillStyle='rgba('+(rnd()<.5?'0,0,0':'255,255,255')+','+rnd()*.09+')';x.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*2);}
  x.fillStyle='rgba(0,0,0,.14)';x.fillRect(0,h/2-1,w,2);x.fillRect(0,h-2,w,2);x.fillRect(w/2-1,0,2,h);
  for(const px of[16,112])for(const py of[32,96]){x.beginPath();x.arc(px,py,2.5,0,6.3);x.fill();}
  x.fillStyle='rgba(60,50,40,.07)';for(let k=0;k<5;k++)x.fillRect(rnd()*w,0,6+rnd()*10,h*(.4+rnd()*.5));
  if(M.g==='maze')for(let k=0;k<4;k++){x.strokeStyle=['#7a4fd6','#e8a020','#2fb0c0','#d03a5a'][k];x.lineWidth=6;x.beginPath();x.moveTo(10+rnd()*40,20+k*25);x.bezierCurveTo(40,rnd()*128,80,rnd()*128,118,30+k*22);x.stroke();}});}
function sky(M){const t=tex(512,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h/2);g.addColorStop(0,hx(M.sky));g.addColorStop(1,hx(M.fog));x.fillStyle=g;x.fillRect(0,0,w,h/2);x.fillStyle=hx(M.fog);x.fillRect(0,h/2,w,h/2);
  const sg=x.createRadialGradient(380,50,2,380,50,60);sg.addColorStop(0,'rgba(255,250,230,1)');sg.addColorStop(.2,'rgba(255,245,210,.5)');sg.addColorStop(1,'rgba(255,245,210,0)');x.fillStyle=sg;x.fillRect(300,0,160,120);
  for(let k=0;k<16;k++){const cx=rnd()*w,cy=25+rnd()*80;for(let j=0;j<6;j++){x.fillStyle='rgba(255,255,255,'+(.12+rnd()*.16)+')';x.beginPath();x.ellipse(cx+j*16-40,cy+rnd()*8,22+rnd()*22,7+rnd()*7,0,0,6.3);x.fill();}}});
  add(new THREE.SphereGeometry(250,24,12),new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,fog:false}),0,0,0);}
function mapSvg(m,i){let w='';for(let k=0;k<5;k++){const x=8+k*18+(i*7+k*5)%9,hh=14+((i+k)*11)%22;w+='<rect x="'+x+'" y="'+(78-hh)+'" width="'+(10+k%2*6)+'" height="'+hh+'" fill="'+hx(m.wall)+'" stroke="rgba(0,0,0,.25)"/>';}
  return '<svg viewBox="0 0 100 130" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g'+i+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+hx(m.sky)+'"/><stop offset="1" stop-color="'+hx(m.fog)+'"/></linearGradient></defs><rect width="100" height="130" fill="url(#g'+i+')"/><circle cx="78" cy="22" r="9" fill="#fff" opacity=".8"/><rect y="70" width="100" height="60" fill="'+hx(m.out)+'"/><polygon points="12,130 88,130 74,76 26,76" fill="'+hx(m.gnd)+'"/>'+w+(m.tr?'<circle cx="10" cy="66" r="9" fill="'+hx(m.tr)+'"/><circle cx="92" cy="64" r="10" fill="'+hx(m.tr)+'"/>':'')+'</svg>';}
function loadMap(i){
  const M=MAPS[i];boxes.length=0;seed=7+i;
  while(mapG.children.length)mapG.remove(mapG.children[0]);
  scene.background.setHex(M.sky);scene.fog.color.setHex(M.fog);
  const wm=new THREE.MeshLambertMaterial({map:conTex(M)}),bl=lam(0x2f55c4),stm=lam(0xb8bec2),dk=lam(0x202328),orn=lam(0xd9743a);
  add(new THREE.PlaneGeometry(400,400),lam(M.out),0,-.03,0).rotation.x=-Math.PI/2;
  add(new THREE.PlaneGeometry(40,56),lam(M.gnd),0,0,5).rotation.x=-Math.PI/2;
  tatami(0,4);
  if(M.g==='curves'){
    [[-7,8,4,0,5.2],[-7,8,7,0,5.2],[9,16,3.5,.8,5.6],[9,16,6.5,.8,5.6]].forEach(([cx,cz,r,a0,a1])=>{for(let a=a0;a<a1;a+=1/r)blk(cx+r*Math.cos(a),cz+r*Math.sin(a),.55,.55,1+.45*(Math.floor(a*2)%2),wm);});
    for(let k=0;k<6;k++)blk(14,-4+k*1.6,3,.8,.25+k*.25,lam(0xc99a5a));
    blk(-14,24,.7,4,2.2,wm);blk(15,26,.7,3,1.6,wm);blk(-14,-6,1.5,1.5,1.2,wm);
  }else if(M.g==='pipes'){
    [[-10,8],[6,12],[-4,22]].forEach(([x,z])=>{blk(x,z,4,.5,1.6,wm);blk(x+3.5,z+1.8,.5,2,2.2,wm);rail(x,1.9,z,8,'x',stm);});
    for(let k=0;k<14;k++)blk(-16+rnd()*32,rnd()*30,.5,.5,.5+.4*(rnd()>.5),wm);
    frame(-13,20,6,4,3,bl);frame(12,24,5,4,2.5,bl);
  }else if(M.g==='frames'){
    blk(-8,14,3,.6,2,wm);blk(8,20,.6,3,2.4,wm);blk(0,28,5,.6,1.4,wm);
    for(let k=0;k<6;k++)blk(-14+k*5.5,6+rnd()*4,.25,.25,.6,dk);
    frame(-12,8,5,3,3,stm);frame(8,6,4,6,2.5,stm);frame(-3,22,7,3,3,stm);
  }else if(M.g==='blocks'){
    for(let ix=-2;ix<=2;ix++)for(let iz=0;iz<3;iz++){if(rnd()<.75)blk(ix*6,10+iz*6,.6,2.4,2+Math.floor(rnd()*3),wm);if(rnd()<.6)blk(ix*6+3,12+iz*6,2.4,.6,1.5+Math.floor(rnd()*2),wm);}
    blk(-6,24,7,.9,3.6,wm);
  }else{
    blk(-8,12,5,.5,1.4,wm);blk(-13,15,.5,3,1.4,wm);blk(-8,18,5,.5,1.4,wm);blk(10,16,.5,4,2.2,wm);blk(-14,28,4,.5,2.2,wm);blk(8,6,4,.5,1.2,wm);
    for(let k=0;k<12;k++)blk(-16+rnd()*32,rnd()*30,.6,.6,.6+.4*(rnd()>.5),wm);
    for(const sx of[-1,1])add(new THREE.BoxGeometry(1,.5,56),orn,sx*20.3,.25,5);
  }
  for(let k=0;k<30;k++){const a=k/30*TAU+rnd()*.2,r=46+rnd()*14,x=Math.cos(a)*r,z=Math.sin(a)*r+5;

let orb=.6,lastName='',acc=0,fr=0,last=performance.now();
const camT=new THREE.Vector3();camera.position.set(0,3,-20);
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.033);last=now;
  if(mode==='play'){if(!paused)step(wheelOpen?dt*.15:dt);}else{for(const l of[legL,legR,kneeL,kneeR,armL,armR,elbL,elbR])l.rotation.x*=Math.exp(-10*dt);rig.quaternion.identity();}
  player.position.copy(pos);player.rotation.y=heading;
  const gh=floorAt(pos.x,pos.z,pos.y);blob.position.set(pos.x,gh+.03,pos.z);blob.scale.setScalar(Math.max(.4,1.2-(pos.y-HALF-gh)*.15));
  const cd=7.2*Math.cos(camEl);camT.set(pos.x-Math.sin(camYaw)*cd,Math.max(.6,pos.y+7.2*Math.sin(camEl)),pos.z-Math.cos(camYaw)*cd);
  if(mode==='play'){camera.position.lerp(camT,1-Math.exp(-7*dt));camera.lookAt(pos.x,pos.y+.8,pos.z);}else{orb+=dt*.35;camera.position.set(pos.x+Math.sin(orb)*3.4,pos.y+.6,pos.z+Math.cos(orb)*3.4);camera.lookAt(pos.x,pos.y+.15,pos.z);}
  renderer.render(scene,camera);if(mode==='play')drawMini();
  let nm='LISTO',p=0;
  if(trick){nm=trick.name+(trick.laps>1?' x'+trick.laps:'')+(trick.sw?' SWITCH':'');p=prog();}else if(flash>0){nm=flashTxt;p=flashOk?1:0;}
  if(nm!==lastName){$('tname').textContent=nm;lastName=nm;}
  $('pbar').style.width=(p*100)+'%';
  acc+=dt;fr++;if(acc>=.5){$('fps').textContent='FPS '+Math.round(fr/acc);acc=0;fr=0;}
}
const mmC=$('mm'),mcx=mmC.getContext('2d');
function drawMini(){
  const W=mmC.width,H=mmC.height,X0=-21,X1=21,Z0=-25,Z1=35,sx=v=>(v-X0)/(X1-X0)*W,sz=v=>(v-Z0)/(Z1-Z0)*H;
  mcx.clearRect(0,0,W,H);mcx.fillStyle='rgba(12,22,18,.75)';mcx.fillRect(0,0,W,H);
  mcx.fillStyle='rgba(224,122,146,.55)';mcx.fillRect(sx(-20),sz(-23),sx(20)-sx(-20),sz(33)-sz(-23));
  for(const b of boxes){mcx.fillStyle=b.bounce?'#ffc2d0':'rgba(235,240,248,.92)';const x0=sx(b.x-b.hw),y0=sz(b.z-b.hd);mcx.fillRect(x0,y0,Math.max(2,sx(b.x+b.hw)-x0),Math.max(2,sz(b.z+b.hd)-y0));}
  const px=sx(pos.x),py=sz(pos.z);
  mcx.strokeStyle='#ffcf4a';mcx.lineWidth=3;mcx.beginPath();mcx.moveTo(px,py);mcx.lineTo(px+Math.sin(heading)*14,py+Math.cos(heading)*14);mcx.stroke();
  mcx.fillStyle='#ffcf4a';mcx.beginPath();mcx.arc(px,py,6,0,TAU);mcx.fill();
}
const scr=$('scr'),esc=t=>String(t).replace(/[&<>"]/g,'');
function save(){try{localStorage.setItem(KEY,JSON.stringify({cfg,set}));}catch(e){}}
function setMode(m){mode=m;document.body.classList.toggle('play',m==='play');if(m==='play')camera.clearViewOffset();else{paused=false;$('menu').hidden=true;camera.setViewOffset(innerWidth,innerHeight,-innerWidth*.2,0,innerWidth,innerHeight);}camera.updateProjectionMatrix();}
const chips=(a,l,cur)=>'<div class="row">'+l.map((t,i)=>'<button class="ch'+(i===cur?' on':'')+'" data-a="'+a+'" data-v="'+i+'">'+t+'</button>').join('')+'</div>';
const sws=(a,l,cur)=>'<div class="row">'+l.map((c,i)=>'<button class="sw'+(i===cur?' on':'')+'" data-a="'+a+'" data-v="'+i+'" style="background:'+hx(c)+'"></button>').join('')+'</div>';
function show(n){let h;scr.hidden=false;
  if(n==='home')h='<h1>TRICK<br><em>PARK</em></h1>'+(saved?'<div class="lb">Hola, '+esc(cfg.name)+'</div><button class="bt" data-a="play">JUGAR</button><button class="bt g" data-a="set">AJUSTES</button>':'<button class="bt" data-a="new">EMPEZAR</button>');
  else if(n==='make')h='<div class="pn"><div class="lb">Nombre</div><input type="text" id="nm" maxlength="14" placeholder="Tu nombre" value="'+esc(cfg.name)+'"><div class="lb">Género</div>'+chips('g',['Hombre','Mujer'],cfg.g==='f'?1:0)+'<div class="lb">Piel</div>'+sws('sk',SK,cfg.sk)+'<div class="lb">Pelo</div>'+chips('hs',HS,cfg.hs)+sws('hc',HC,cfg.hc)+'<div class="lb">Atuendo</div>'+chips('ot',OUT.map(o=>o.n),cfg.ot)+'<div class="lb">Gafas</div>'+chips('gl',['Sin gafas','De sol','Redondas'],cfg.gl)+'<div class="lb">Gorra</div>'+chips('cap',['No','Sí'],cfg.cap)+'<button class="bt" data-a="save">GUARDAR Y SEGUIR</button></div>';
  else if(n==='maps')h='<h2>ELIGE TU MAPA</h2><div class="cards">'+MAPS.map((m,i)=>'<button class="card" data-a="map" data-v="'+i+'">'+mapSvg(m,i)+'<b>'+m.n+'</b><small>'+m.d+'</small></button>').join('')+'</div><button class="bt g" data-a="home" style="min-width:0;padding:1.2vh 4vh;font-size:4vh">VOLVER</button>';
  else h='<h2>AJUSTES</h2><div class="lb">Sensibilidad de cámara</div><input type="range" id="sn" min="0.5" max="2" step="0.1" value="'+set.sens+'"><div class="lb">Cámara vertical</div>'+chips('inv',['Normal','Invertida'],set.inv)+'<button class="bt g" data-a="edit">EDITAR PERSONAJE</button><button class="bt g" data-a="wipe">BORRAR PARTIDA</button><button class="bt" data-a="home">VOLVER</button>';
  scr.innerHTML=h;}
function act(a,v){v=+v;
  if(a==='new'||a==='edit')show('make');else if(a==='play')show('maps');else if(a==='set')show('settings');else if(a==='home')show('home');
  else if(a==='map'){loadMap(v);scr.hidden=true;setMode('play');}
  else if(a==='save'){cfg.name=(cfg.name||'').trim()||'Jugador';saved=true;save();show('home');}
  else if(a==='inv'){set.inv=v;save();show('settings');}
  else if(a==='wipe'){try{localStorage.removeItem(KEY);}catch(e){}saved=false;cfg=Object.assign({},DEF);set={sens:1,inv:0};buildChar(cfg);show('home');}
  else{cfg[a]=a==='g'?(v?'f':'m'):v;buildChar(cfg);show('make');}}
scr.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v);});
scr.addEventListener('input',e=>{if(e.target.id==='nm')cfg.name=e.target.value;if(e.target.id==='sn'){set.sens=+e.target.value;save();}});
$('toHome').addEventListener('click',()=>{setPause(false);loadMap(Math.floor(Math.random()*MAPS.length));setMode('home');show('home');});
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.cfg){cfg=Object.assign({},DEF,d.cfg);set=Object.assign(set,d.set);saved=true;}}catch(e){}
buildChar(cfg);loadMap(3);setMode('home');show('home');
requestAnimationFrame(loop);
})();}catch(e){showError(e)}}

})();
